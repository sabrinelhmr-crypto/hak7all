security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_home
                check_path: app_login
                enable_csrf: true
                csrf_token_id: authenticate
                success_handler: App\Security\LoginSuccessHandler
                failure_path: app_home
            logout:
                path: app_logout
                target: app_home
                enable_csrf: true
                csrf_token_id: logout
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

    access_control:
        - { path: ^/(_profiler|_wdt|assets|build), roles: PUBLIC_ACCESS }
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/(conditions|confidentialite)$, roles: PUBLIC_ACCESS }
        - { path: ^/(verification-email|mot-de-passe-oublie|reinitialiser-mot-de-passe|connexion|deconnexion), roles: PUBLIC_ACCESS }
        - { path: ^/api/push/cle-publique$, roles: PUBLIC_ACCESS }
        - { path: ^/client, roles: ROLE_CLIENT }
        - { path: ^/artisan, roles: ROLE_WORKER }
        - { path: ^/compte, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
